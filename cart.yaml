- name: configure cart
  hosts: cart
  become: yes
  tasks:
  - name: enable nodejs 20
    ansible.builtin.dnf:
      name: "@nodejs:20"
      state: present

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: create app user roboshop
    ansible.builtin.user:
      name: roboshop
      state: present
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: remove app directory if exists
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: remove existing cart.zip file
    ansible.builtin.file:
      path: /tmp/cart.zip
      state: absent
  
  - name: download the application code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

  - name: Install dependencies based on package.json.
    community.general.npm:
      path: /app

  - name: copy cart service file for systemd 
    ansible.builtin.template:
      src: cart.service
      dest: /etc/systemd/system/cart.service

  - name: systemd deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: enable and start service
    ansible.builtin.service:
      name: cart
      state: restarted
      enabled: yes